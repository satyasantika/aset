# ASET FKIP — produksi. Tanpa MySQL: basis data SQLite (mode WAL) pada volume `data`, dicadangkan harian.
# Jalankan: docker compose -f compose.prod.yaml --env-file .env.production up -d --build
name: siman

x-app: &app
  build:
    context: .
    target: runtime
  image: siman-fkip:${APP_VERSION:-latest}
  env_file: .env.production
  environment:
    DB_CONNECTION: sqlite
    DB_DATABASE: /data/database.sqlite
    REDIS_HOST: redis
  volumes:
    - data:/data
    - storage:/var/www/html/storage
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      target: web
    image: siman-fkip-web:${APP_VERSION:-latest}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped

  queue:
    <<: *app
    command: php artisan horizon
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cadangan:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite tzdata >/dev/null && exec /cadangan.sh"]
    environment:
      DB_DATABASE: /data/database.sqlite
      CADANGAN_DIR: /cadangan
      CADANGAN_HARI: ${CADANGAN_HARI:-30}
      CADANGAN_JAM: ${CADANGAN_JAM:-02:00}
      TZ: Asia/Jakarta
    volumes:
      - data:/data:ro
      - ./cadangan:/cadangan
      - ./docker/scripts/cadangan.sh:/cadangan.sh:ro
    restart: unless-stopped

volumes:
  data:
  storage:
  redis:
